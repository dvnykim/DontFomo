name: Daily recap

on:
  schedule:
    # 09:00 UTC. Measured against 7 days of Solana volume: 06:00-11:00 UTC is the
    # quietest window (~2.6-3.0%/hr) while 12:00-15:00 is the busiest (~5-9%/hr).
    # Running in the trough means the snapshot lands after the US session has wound
    # down, instead of catching a coin mid-run. Publish around 13:00 UTC.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite today's snapshot if it already exists"
        type: boolean
        default: false

# Prevent a manual run and the nightly cron from racing on the same commit.
concurrency:
  group: daily-recap
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    # Coverage of 24 runners costs ~2 keyless requests each at 7s apiece, plus
    # 429 backoffs, so a normal run is 20-30 minutes. This is a ceiling on a
    # hung run, not a target — the default is 6 hours.
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the local major. Type-stripping support differs across
          # versions, so a mismatch surfaces as a CI-only parse failure at 09:00 UTC.
          node-version: "26"
          cache: npm

      # Collection uses built-in fetch only, but narration needs @anthropic-ai/sdk.
      # Without this the snapshot builds fine and generation dies with
      # ERR_MODULE_NOT_FOUND — which continue-on-error then hides behind a green tick.
      - name: Install dependencies
        run: npm ci

      - name: Build snapshot
        env:
          # Optional. Absent key => runners keep `traders: null` and the site
          # renders empty states rather than failing the run.
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: node --experimental-strip-types src/run.ts ${{ inputs.force && '--force' || '' }}

      - name: Generate narrative
        id: narrate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Non-fatal: a generation failure should still leave the snapshot committed
        # and the site rendered with empty catalyst sections, not lose the day.
        continue-on-error: true
        run: node --experimental-strip-types src/narrate.ts

      # continue-on-error leaves the job green, so a broken generator can go unnoticed
      # for weeks while snapshots keep committing. Surface it in the run summary.
      - name: Report narration failure
        if: steps.narrate.outcome == 'failure'
        run: |
          echo "::warning title=Narrative generation failed::Snapshot committed, but notes/ was not written."
          echo "### ⚠️ Narrative generation failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The snapshot was still committed. The site will render without catalysts." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit snapshot and narrative
        run: |
          git config user.name "dontfomo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ notes/
          # No diff means the snapshot already existed; that's a no-op, not a failure.
          if git diff --staged --quiet; then
            echo "No new snapshot to commit."
            exit 0
          fi
          git commit -m "recap: $(date -u +%Y-%m-%d)"

          # Rebase and retry. A run takes ~15 minutes, so an ordinary push to
          # main while it works is routine rather than exceptional — and a bare
          # `git push` turns that into a permanent archive gap, because the
          # snapshot is a point-in-time record that cannot be rebuilt later.
          # This failed exactly that way on its first real run: both the
          # snapshot and the narrative succeeded and were then thrown away.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main
          done
          echo "::error::Could not push the snapshot after 3 attempts."
          exit 1

  # Publish the rendered page. Separate job because site/ is gitignored by
  # design — the rendered HTML carries platform content that must not be
  # archived, so it is built fresh and deployed, never committed.
  deploy:
    needs: recap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pull the commit the recap job just pushed, not the one this run started on.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render site
        run: node --experimental-strip-types src/site/build.ts

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
